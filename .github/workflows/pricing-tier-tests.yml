name: Room Pricing Tier Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pricing-tier-tests:
    name: Verify room pricing tier selection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Targeted regression guard: La Quinta tier-boundary cases.
      # Blocks the PR if 3-room bookings stop resolving to the 1–5 tier
      # (e.g. silently re-pricing at the $60/$70/$80 bulk rate).
      - name: Run roomPricingTier unit tests
        run: bunx vitest run src/lib/roomPricingTier.test.ts --reporter=verbose

      # Broader safety net: hotel availability invariants.
      - name: Run hotelAvailability unit tests
        run: bunx vitest run src/lib/hotelAvailability.test.ts --reporter=verbose
